name: TechFest 2026 CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Server Automated Tests & Security Checks
        run: |
          cd server
          npm test

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build React Client (Code Splitting & Verification)
        run: |
          cd client
          npm run build
